name: release

# Trigger on bare semver tags (e.g. 1.0.0). Matches the existing
# tag history in this repo — no leading v.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, test, publish release
    runs-on: [self-hosted, linux, ovh3]
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build test image
        run: docker build -f tests/Dockerfile.test -t voip_patrol-tests:${{ github.sha }} .

      - name: Run tests
        run: docker run --rm voip_patrol-tests:${{ github.sha }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Clean up image
        if: always()
        run: docker rmi voip_patrol-tests:${{ github.sha }} || true
